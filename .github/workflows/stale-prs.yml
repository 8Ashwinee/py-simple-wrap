name: Close stale pull requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:

          days-before-issue-stale: -1
          days-before-issue-close: -1

          days-before-pr-stale: 7
          days-before-pr-close: 3

          exempt-pr-labels: 'keep-open'

          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has had no activity for 7 days and has been marked stale.
            It will be closed in 3 days if no further activity occurs.
            Add the `keep-open` label to exempt it from closing.
          close-pr-message: >
            This pull request has been closed due to 10 days of inactivity.
            Feel free to reopen it if you'd like to continue the work.

          remove-stale-when-updated: true
